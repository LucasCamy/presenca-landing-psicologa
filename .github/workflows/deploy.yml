name: Build and Push Docker Image to GHCR

# Cada push na main: valida (lint, testes, typecheck+build) e publica a imagem.
# O Keel no k3s detecta o novo digest de :latest em até 1 minuto e faz o rollout.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Testes de conteúdo
        run: npm test

      - name: Typecheck e build
        run: npm run build

  build-and-deploy:
    name: Build & Push Image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair Metadados e Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lucascamy/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Compilar e Publicar Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
