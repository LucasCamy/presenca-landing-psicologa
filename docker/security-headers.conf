# Incluído em TODOS os blocos `location`: no Nginx, um `add_header` dentro de um location
# anula os herdados do server, então os cabeçalhos de segurança são repetidos aqui.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Tudo é servido pelo próprio site (fontes self-hosted, sem CDNs nem rastreadores).
# 'unsafe-inline' em style-src: o Motion aplica estilos inline (transform/opacity) nas animações.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
