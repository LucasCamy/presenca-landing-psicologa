<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustração demonstrativa de um consultório claro com poltrona, planta, estante e janela">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBE3D8"/><stop offset="1" stop-color="#E2D9CC"/></linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFDF9" stop-opacity=".9"/><stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#w)"/>
  <!-- janela -->
  <rect x="70" y="70" width="270" height="300" rx="8" fill="#FFFDF9" stroke="#D9D0C6" stroke-width="4"/>
  <path d="M205 70v300M70 220h270" stroke="#D9D0C6" stroke-width="4"/>
  <path d="M110 120 C150 100 190 110 230 150" stroke="#C9C2A2" stroke-width="3" fill="none" opacity=".5"/>
  <path d="M70 370 L340 370 L640 600 L250 600Z" fill="url(#l)" opacity=".28"/>
  <path d="M340 90 L700 330 L700 420 L340 200Z" fill="url(#l)" opacity=".18"/>
  <!-- estante -->
  <rect x="640" y="90" width="250" height="8" rx="4" fill="#B9A38D"/>
  <rect x="640" y="210" width="250" height="8" rx="4" fill="#B9A38D"/>
  <g>
    <rect x="660" y="30" width="20" height="60" rx="2" fill="#C9C2A2"/><rect x="684" y="42" width="16" height="48" rx="2" fill="#C9906A"/><rect x="704" y="24" width="22" height="66" rx="2" fill="#E6D2C3"/><rect x="730" y="46" width="14" height="44" rx="2" fill="#F3D3BE"/>
    <rect x="800" y="40" width="70" height="50" rx="4" fill="#EEE8E0" stroke="#D9D0C6"/>
    <rect x="662" y="150" width="60" height="60" rx="3" fill="#FFFDF9" stroke="#D9D0C6"/>
    <path d="M670 200 l16 -26 l14 16 l10 -12 l12 22Z" fill="#E6D2C3"/>
    <rect x="750" y="152" width="18" height="58" rx="2" fill="#9A5B3A"/><rect x="772" y="164" width="16" height="46" rx="2" fill="#C9906A"/><rect x="792" y="146" width="20" height="64" rx="2" fill="#C9C2A2"/>
    <circle cx="858" cy="186" r="22" fill="#C9906A"/><path d="M858 164c-6-20 8-26 8-40" stroke="#A39A74" stroke-width="3" fill="none"/>
  </g>
  <!-- tapete e piso -->
  <rect y="470" width="960" height="130" fill="#D9C7B2"/>
  <ellipse cx="480" cy="540" rx="330" ry="46" fill="#EEE8E0"/>
  <ellipse cx="480" cy="540" rx="290" ry="34" fill="none" stroke="#D9D0C6" stroke-width="2"/>
  <!-- poltrona -->
  <g transform="translate(330 330)">
    <path d="M20 40 Q20 0 70 0 H190 Q240 0 240 40 V150 H20Z" fill="#D9A27F"/>
    <rect x="0" y="80" width="46" height="120" rx="22" fill="#C98E6A"/>
    <rect x="214" y="80" width="46" height="120" rx="22" fill="#C98E6A"/>
    <rect x="30" y="120" width="200" height="80" rx="20" fill="#E3B697"/>
    <rect x="62" y="30" width="136" height="64" rx="20" fill="#F0CDB4"/>
    <rect x="30" y="200" width="12" height="40" rx="5" fill="#8A6A4F"/><rect x="218" y="200" width="12" height="40" rx="5" fill="#8A6A4F"/>
    <path d="M60 130 h140" stroke="#FFFDF9" stroke-width="2" opacity=".35"/>
  </g>
  <!-- manta -->
  <rect x="395" y="372" width="64" height="58" rx="16" fill="#FFFFFF" transform="rotate(-12 427 400)"/>
  <!-- mesa lateral + planta -->
  <g transform="translate(650 400)">
    <ellipse cx="60" cy="40" rx="62" ry="12" fill="#C9A17D"/>
    <rect x="56" y="40" width="8" height="100" fill="#A9825F"/>
    <ellipse cx="60" cy="140" rx="36" ry="7" fill="#A9825F"/>
    <path d="M60 30 C40 0 30 -30 46 -60 C70 -30 76 0 60 30Z" fill="#B5AC88"/>
    <path d="M60 30 C80 0 100 -20 120 -22 C112 10 90 28 60 30Z" fill="#C9C2A2"/>
    <path d="M60 30 C40 14 20 8 4 -10 C34 -8 52 6 60 30Z" fill="#A39A74"/>
    <path d="M38 26h44l-5 28H43z" fill="#C9906A"/>
  </g>
  <!-- luminária -->
  <g transform="translate(220 360)">
    <rect x="48" y="40" width="5" height="150" fill="#8A6A4F"/>
    <ellipse cx="50" cy="190" rx="26" ry="6" fill="#8A6A4F"/>
    <path d="M20 40 L80 40 L66 -10 L34 -10Z" fill="#FFFDF9" stroke="#D9D0C6"/>
    <ellipse cx="50" cy="40" rx="30" ry="8" fill="#F3E4CF" opacity=".8"/>
  </g>
</svg>
