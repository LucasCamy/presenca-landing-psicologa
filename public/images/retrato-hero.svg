<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" role="img" aria-label="Ilustração demonstrativa de uma psicóloga em um consultório iluminado por luz natural">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE8DF"/><stop offset="1" stop-color="#F7F3EE"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity=".95"/><stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="520" height="680"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="520" height="680" fill="url(#wall)"/>
    <!-- janela e feixes de luz -->
    <rect x="40" y="60" width="150" height="230" rx="6" fill="#FFFDF9" stroke="#D9D0C6" stroke-width="3"/>
    <path d="M115 60v230M40 175h150" stroke="#D9D0C6" stroke-width="3"/>
    <path d="M40 290 L190 290 L420 560 L190 560 Z" fill="url(#light)" opacity=".7"/>
    <path d="M190 120 L430 330 L430 420 L190 230 Z" fill="url(#light)" opacity=".45"/>
    <!-- prateleira com livros -->
    <rect x="300" y="150" width="190" height="6" rx="3" fill="#B9A38D"/>
    <rect x="316" y="104" width="16" height="46" rx="2" fill="#C9C2A2"/>
    <rect x="336" y="94" width="14" height="56" rx="2" fill="#C9906A"/>
    <rect x="354" y="110" width="18" height="40" rx="2" fill="#E6D2C3"/>
    <rect x="376" y="100" width="12" height="50" rx="2" fill="#F3D3BE"/>
    <circle cx="448" cy="130" r="18" fill="#EEE8E0" stroke="#D9D0C6"/>
    <!-- planta -->
    <g transform="translate(60 440)">
      <path d="M60 140 C20 90 10 40 40 0 C70 40 80 90 60 140Z" fill="#B5AC88"/>
      <path d="M60 140 C90 100 120 70 150 60 C140 110 110 140 60 140Z" fill="#C9C2A2"/>
      <path d="M60 140 C30 120 0 110 -20 80 C30 80 55 100 60 140Z" fill="#A39A74"/>
      <path d="M30 140h70l-8 90H38z" fill="#C9906A"/>
      <rect x="26" y="132" width="78" height="14" rx="4" fill="#B07A5A"/>
    </g>
    <!-- figura -->
    <path d="M110 680 C110 560 170 505 260 505 C350 505 410 560 410 680Z" fill="#9A5B3A"/>
    <path d="M225 505 L260 575 L295 505Z" fill="#FFFDF9"/>
    <path d="M235 470 h50 v45 q-25 25 -50 0z" fill="#DDB59B"/>
    <path d="M235 495 q25 14 50 0" fill="none" stroke="#C99B80" stroke-width="2"/>
    <ellipse cx="260" cy="395" rx="62" ry="78" fill="#E8C4AA"/>
    <!-- cabelo -->
    <path d="M196 395 C190 310 232 300 262 300 C305 300 335 335 324 400 C318 360 296 340 262 338 C232 338 206 352 196 395Z" fill="#4A3A33"/>
    <path d="M196 395 C186 430 192 470 206 490 C196 450 200 420 206 400Z" fill="#4A3A33"/>
    <circle cx="262" cy="296" r="28" fill="#4A3A33"/>
    <!-- feições discretas -->
    <path d="M233 392 q9 6 18 0 M273 392 q9 6 18 0" fill="none" stroke="#6B5246" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M248 432 q14 10 28 0" fill="none" stroke="#B9735E" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M262 400 v18 q-6 4 -2 6" fill="none" stroke="#C99B80" stroke-width="2" stroke-linecap="round"/>
    <circle cx="228" cy="418" r="9" fill="#D9958A" opacity=".35"/><circle cx="296" cy="418" r="9" fill="#D9958A" opacity=".35"/>
    <!-- brinco -->
    <circle cx="198" cy="425" r="4" fill="#C9906A"/>
  </g>
</svg>
